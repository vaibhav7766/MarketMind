[project]
name = "stock-analyzer-backend"
version = "0.1.0"
description = "Backend for Stock Analyzer"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "yfinance",
    "pandas",
    "google-genai",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "weasyprint>=69.0",
    "jinja2>=3.1.6",
    "trafilatura>=2.1.0",
    "beautifulsoup4>=4.14.3",
    "ddgs>=9.14.4",
    "chromadb>=1.5.9",
    "curl-cffi>=0.15.0",
    "ta>=0.11.0",
    "googlenewsdecoder>=0.1.7",
]

[tool.uv]
# uv is a fast Python package manager and runner; this config ensures dependencies are installed.
